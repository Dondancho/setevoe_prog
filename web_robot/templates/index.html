<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robot Control</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a1a; color: #eee; }
        h1 { font-size: 1.5em; }
        .btn {
            display: inline-block;
            width: 80px; height: 80px;
            margin: 5px;
            font-size: 2em;
            border: none;
            border-radius: 15px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        .btn:active { background: #555; }
        .stop { background: #a00; }
        .status { margin-top: 20px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <h1>Robot Control</h1>
    <div>
        <button class="btn" onclick="send('forward')">↑</button>
    </div>
    <div>
        <button class="btn" onclick="send('left')">←</button>
        <button class="btn stop" onclick="send('stop')">■</button>
        <button class="btn" onclick="send('right')">→</button>
    </div>
    <div>
        <button class="btn" onclick="send('back')">↓</button>
    </div>
    <div class="status" id="status">Готов</div>

    <script>
        function send(cmd) {
            fetch('/cmd/' + cmd)
                .then(r => r.text())
                .then(t => document.getElementById('status').textContent = t);
        }
        document.addEventListener('keydown', e => {
            const map = {ArrowUp:'forward', ArrowDown:'back', ArrowLeft:'left', ArrowRight:'right', ' ':'stop'};
            if (map[e.key]) { send(map[e.key]); e.preventDefault(); }
        });
    </script>
</body>
</html>
