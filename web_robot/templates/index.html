<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Robot Control</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #1a1a1a; color: #eee; }
        h1 { font-size: 1.5em; }
        .btn {
            display: inline-block;
            width: 80px; height: 80px;
            margin: 5px;
            font-size: 2em;
            border: none;
            border-radius: 15px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        .btn:active { background: #555; }
        .stop { background: #a00; }
        .telemetry {
            margin-top: 30px;
            padding: 15px;
            background: #222;
            border-radius: 10px;
            font-size: 1.2em;
        }
        .telemetry span { color: #4caf50; font-weight: bold; }
        .status { margin-top: 10px; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <h1>Robot Control</h1>
    <div>
        <button class="btn" onclick="send('forward')">↑</button>
    </div>
    <div>
        <button class="btn" onclick="send('left')">←</button>
        <button class="btn stop" onclick="send('stop')">■</button>
        <button class="btn" onclick="send('right')">→</button>
    </div>
    <div>
        <button class="btn" onclick="send('back')">↓</button>
    </div>

    <div class="telemetry">
        Позиция: X = <span id="x">0.0</span>, Y = <span id="y">0.0</span>
    </div>
    <div class="status" id="status">Готов</div>

    <script>
        function send(cmd) {
            fetch('/cmd/' + cmd)
                .then(r => r.text())
                .then(t => {
                    document.getElementById('status').textContent = 'Ответ: ' + t;
                    // Парсим "x=0.5,y=1.0"
                    const match = t.match(/x=([-\d.]+),y=([-\d.]+)/);
                    if (match) {
                        document.getElementById('x').textContent = match[1];
                        document.getElementById('y').textContent = match[2];
                    }
                });
        }
        document.addEventListener('keydown', e => {
            const map = {ArrowUp:'forward', ArrowDown:'back', ArrowLeft:'left', ArrowRight:'right', ' ':'stop'};
            if (map[e.key]) { send(map[e.key]); e.preventDefault(); }
        });
    </script>
</body>
</html>
